# Build the website (Astro Starlight in site/) and publish it to GitHub Pages, https://a1o1.github.io/trig-seedr/,
# on every push to main that touches the site or the docs it copies (or by hand).
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', 'tools/README.md', 'CONTRIBUTING.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v6
        with:
          path: site
          node-version: 22
          package-manager: npm

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
