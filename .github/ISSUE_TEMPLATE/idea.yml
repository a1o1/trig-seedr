name: Idea
description: A change or a feature you would like.
title: "Idea: "
labels: ["idea"]
body:
  - type: textarea
    id: what
    attributes:
      label: What you would like
      description: The change, on which page or knob, as you would use it.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you were trying to make, and what got in the way.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: trig-seedr version you use
      placeholder: TS07
